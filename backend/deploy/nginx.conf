# Copy to /etc/nginx/sites-available/leadflow-api, symlink into sites-enabled,
# then run: sudo certbot --nginx -d api.yourdomain.com
# (certbot will rewrite this file to add the SSL server block automatically).

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # File uploads go direct-to-B2 via presigned URLs, so request bodies
        # through this proxy stay small — default client_max_body_size is fine.
    }
}
